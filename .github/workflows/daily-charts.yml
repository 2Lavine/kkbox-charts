name: daily-charts

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）KKBOX 榜单通常已更新
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Fetch charts & download audio
        run: python3 kkbox_charts.py --download

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ music/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: $(date +'%Y-%m-%d') 榜单数据 + 音频更新"
            git push
          fi
