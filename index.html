<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日音樂榜單</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  background: #0d0d0d; color: #f5f5f5;
  display: flex; min-height: 100vh;
}

/* 侧边目录 */
.sidebar {
  width: 200px; min-width: 200px;
  border-right: 1px solid #1a1a1a;
  padding: 1.5rem 0;
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
}
.sidebar h1 {
  font-size: .9rem; font-weight: 700; padding: 0 1.2rem; margin-bottom: 1.2rem;
  color: #ccc; letter-spacing: .5px;
}
.sidebar ul { list-style: none; }
.sidebar li a {
  display: block; padding: .55rem 1.2rem;
  color: #888; font-size: .82rem; text-decoration: none;
  transition: all .15s; border-left: 2px solid transparent;
}
.sidebar li a:hover { color: #e0e0e0; background: #141414; }
.sidebar li a.active {
  color: #ff5c38; border-left-color: #ff5c38; background: rgba(255,92,56,.05);
  font-weight: 600;
}
.sidebar .weekday { color: #555; font-size: .72rem; margin-left: .4rem; }

/* 主内容 */
.main { flex: 1; padding: 2rem 2.5rem; max-width: 860px; }
.main .header { margin-bottom: 2rem; }
.main .header h2 { font-size: 1.3rem; font-weight: 700; }
.main .header .meta { color: #666; font-size: .78rem; margin-top: .3rem; }

section { margin-bottom: 2.5rem; }
section > h3 {
  font-size: 1rem; font-weight: 600; margin-bottom: .8rem; color: #e0e0e0;
  padding-bottom: .5rem; border-bottom: 1px solid #222;
}
table { width: 100%; border-collapse: collapse; }
tr { border-bottom: 1px solid #1a1a1a; transition: background .15s; }
tr:hover { background: #141414; }
td { padding: .6rem .4rem; vertical-align: top; }
.rank { font-size: 1.05rem; font-weight: 700; width: 2rem; text-align: center; color: #aaa; padding-top: .9rem; }
tr:nth-child(-n+3) .rank { color: #ff5c38; }
.trend { width: 2.2rem; text-align: center; padding-top: .9rem; }
.badge { font-size: .66rem; padding: .1rem .3rem; border-radius: 3px; }
.badge.up { color: #4caf50; }
.badge.down { color: #f44336; }
.badge.same { color: #555; }
.badge.new { color: #ff9800; font-weight: 600; }
.cover img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; }
.info { display: flex; flex-direction: column; gap: 2px; }
.song { color: #f5f5f5; font-weight: 500; font-size: .88rem; }
.artist { color: #888; font-size: .76rem; }
.bili { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.bili-link {
  display: inline-block; font-size: .7rem; color: #7ec8e3;
  background: rgba(126,200,227,.08); border: 1px solid rgba(126,200,227,.2);
  padding: 2px 7px; border-radius: 4px; text-decoration: none;
  max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: all .15s;
}
.bili-link:hover { background: rgba(126,200,227,.18); color: #a8dcf0; }
.empty { color: #555; font-size: .85rem; padding: 3rem 0; text-align: center; }

@media (max-width: 700px) {
  body { flex-direction: column; }
  .sidebar {
    width: 100%; min-width: unset; height: auto; position: static;
    border-right: none; border-bottom: 1px solid #1a1a1a;
    padding: 1rem 0; display: flex; flex-wrap: wrap; align-items: center; gap: 0;
  }
  .sidebar h1 { width: 100%; margin-bottom: .6rem; }
  .sidebar ul { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 1rem; }
  .sidebar li a { padding: .35rem .7rem; border-left: none; border-radius: 4px; }
  .sidebar li a.active { background: rgba(255,92,56,.12); }
  .main { padding: 1.2rem; }
  .cover img { width: 36px; height: 36px; }
  .bili-link { max-width: 180px; }
}
</style>
</head>
<body>
  <nav class="sidebar">
    <h1>每日音樂榜單</h1>
    <ul id="nav"></ul>
  </nav>
  <div class="main">
    <div class="header">
      <h2 id="title">載入中...</h2>
      <p class="meta" id="meta"></p>
    </div>
    <div id="app"><p class="empty">載入中...</p></div>
  </div>

<script>
const FLAGS = { tw: '🇹🇼', jp: '🇯🇵', hk: '🇭🇰', sg: '🇸🇬', my: '🇲🇾' };
const WEEKDAYS = ['日','一','二','三','四','五','六'];

function fmtPlay(n) { return n >= 10000 ? (n/10000).toFixed(1)+'万' : String(n); }

function rankBadge(rank, last) {
  if (last == null) return '<span class="badge new">NEW</span>';
  const d = last - rank;
  if (d > 0) return `<span class="badge up">▲${d}</span>`;
  if (d < 0) return `<span class="badge down">▼${-d}</span>`;
  return '<span class="badge same">—</span>';
}

function weekday(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return '週' + WEEKDAYS[d.getDay()];
}

function renderChart(data) {
  document.getElementById('title').textContent = `${data.date} ${weekday(data.date)}`;
  document.getElementById('meta').textContent = '藍色標籤可直接跳B站播放';
  let html = '';
  for (const [terr, region] of Object.entries(data.regions)) {
    let rows = '';
    for (const s of region.songs) {
      const links = (s.bili||[]).map(v =>
        `<a href="https://www.bilibili.com/video/${v.bvid}" target="_blank" class="bili-link" title="${v.title}">${v.author} · ${fmtPlay(v.play)}播放 · ${v.duration}</a>`
      ).join('');
      rows += `<tr>
        <td class="rank">${s.rank}</td>
        <td class="trend">${rankBadge(s.rank, s.last_rank)}</td>
        <td class="cover"><img src="${s.cover}" alt="" loading="lazy"></td>
        <td class="info">
          <span class="song">${s.song_name}</span>
          <span class="artist">${s.artist}</span>
          <div class="bili">${links}</div>
        </td>
      </tr>`;
    }
    html += `<section><h3>${FLAGS[terr]||''} ${region.name} 單曲榜</h3><table><tbody>${rows}</tbody></table></section>`;
  }
  document.getElementById('app').innerHTML = html;
}

function loadDate(dateStr) {
  document.querySelectorAll('.sidebar a').forEach(a =>
    a.classList.toggle('active', a.dataset.date === dateStr));
  fetch(`data/${dateStr}.json`)
    .then(r => r.json())
    .then(renderChart)
    .catch(() => {
      document.getElementById('app').innerHTML = '<p class="empty">無數據</p>';
    });
}

// 初始化：加载 manifest 构建目录
fetch('data/manifest.json')
  .then(r => r.json())
  .then(dates => {
    const nav = document.getElementById('nav');
    nav.innerHTML = dates.map(d =>
      `<li><a href="#" data-date="${d}" onclick="loadDate('${d}');return false;">${d}<span class="weekday">${weekday(d)}</span></a></li>`
    ).join('');
    if (dates.length) loadDate(dates[0]);
  })
  .catch(() => {
    // fallback: 直接加载 latest
    fetch('data/latest.json').then(r=>r.json()).then(renderChart);
  });
</script>
</body>
</html>
